<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reportar un problema</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="card" id="card">
  <h1>Abriendo el formulario…</h1>
  <p>Un momento, por favor.</p>
</div>
<script>
// Cada marca tiene su propia carpeta (ej. /visiones-colibri/).
// Esta página solo mantiene funcionando los links viejos con ?marca=<carpeta>: manda a la carpeta de la marca.
(function () {
  var q = new URLSearchParams(location.search);
  var marca = (q.get("marca") || "").trim().toLowerCase();
  if (/^[a-z0-9-]+$/.test(marca)) {
    location.replace("./" + marca + "/" + (q.get("debug") === "1" ? "?debug=1" : ""));
    return;
  }
  document.getElementById("card").innerHTML =
    "<h1>No encontramos tu formulario</h1><p>Este link no tiene una marca válida. Pide a tu contacto de Unmade el link correcto.</p>";
})();
</script>
</body>
</html>
