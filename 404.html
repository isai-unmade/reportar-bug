<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reportar un problema</title>
<style>
  :root { --bg:#f5f7fb; --text:#1d2433; --muted:#5b6475; --card:#fff; --border:#dde2ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --text:#e8ebf2; --muted:#9aa3b5; --card:#1b1f29; --border:#2c3240; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; max-width:560px; width:100%; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { color:var(--muted); margin:0; line-height:1.45; }
</style>
</head>
<body>
<div class="card">
  <h1>No encontramos tu formulario</h1>
  <p>Este link no tiene una marca válida. Pide a tu contacto de Unmade el link correcto.</p>
</div>
</body>
</html>
